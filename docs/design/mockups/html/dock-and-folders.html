<head>

<title>Glaze Shell — dock-and-folders</title>

<style>

body{margin:0}
.root,.root *{box-sizing:border-box}
.root{position:relative;overflow:hidden;font-family:'Figtree','Segoe UI',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
.hd{font-family:'Poppins','Segoe UI',sans-serif;letter-spacing:-.03em}
.light{--text:#25214F;--text2:#6B6894;--text3:#A5A2C8;--glass:rgba(255,255,255,.55);--glassb:rgba(255,255,255,.85);--win:rgba(255,255,255,.62);--card:rgba(255,255,255,.62);--panel:rgba(255,255,255,.5);--line:rgba(90,70,200,.10);--acc:#6A5BEA;--sel:rgba(106,91,234,.13);--field:rgba(70,55,170,.07);--sh:rgba(90,70,200,.18)}
.dark{--text:#F4F1FF;--text2:#B2AED8;--text3:#7773A8;--glass:rgba(34,30,74,.55);--glassb:rgba(255,255,255,.14);--win:rgba(30,27,66,.62);--card:rgba(255,255,255,.07);--panel:rgba(255,255,255,.05);--line:rgba(255,255,255,.09);--acc:#A99BFF;--sel:rgba(169,155,255,.2);--field:rgba(255,255,255,.08);--sh:rgba(0,0,0,.4)}
.wall-light{background:radial-gradient(45% 50% at 8% 10%,rgba(138,222,245,.9),rgba(138,222,245,0) 70%),radial-gradient(40% 55% at 92% 12%,rgba(200,178,255,.95),rgba(200,178,255,0) 70%),radial-gradient(45% 50% at 80% 100%,rgba(255,196,170,.9),rgba(255,196,170,0) 70%),radial-gradient(40% 50% at 10% 100%,rgba(168,240,214,.9),rgba(168,240,214,0) 70%),linear-gradient(135deg,#FFE9F4,#E8EFFF 50%,#EDE6FF)}
.wall-dark{background:radial-gradient(45% 50% at 8% 8%,rgba(100,210,255,.38),rgba(100,210,255,0) 70%),radial-gradient(40% 55% at 95% 15%,rgba(191,90,242,.45),rgba(191,90,242,0) 70%),radial-gradient(45% 50% at 78% 105%,rgba(255,130,170,.3),rgba(255,130,170,0) 70%),radial-gradient(40% 50% at 8% 100%,rgba(94,123,255,.35),rgba(94,123,255,0) 70%),linear-gradient(135deg,#15122F,#1B1840)}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--glassb);box-shadow:0 12px 32px var(--sh)}
.tile svg{width:52%;height:52%;filter:drop-shadow(0 1.5px 2px rgba(60,40,140,.3))}
.dk{position:relative;display:flex;flex-direction:column;align-items:center}
.dk .run{position:absolute;bottom:-13px;width:16px;height:4px;border-radius:2px;background:linear-gradient(90deg,#64D2FF,#BF5AF2)}
.dk .tip{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--glassb);box-shadow:0 8px 20px var(--sh);color:var(--text)}
.sep{width:2px;height:34px;border-radius:1px;background:var(--line);margin:0 6px;align-self:center}
.lbl{font-size:13px;font-weight:600;text-align:center;line-height:1.25;color:var(--text)}
.meta{font-size:11.5px;color:var(--text2);text-align:center}

</style>
</head>
